services:
  - type: web
    name: liuhe-mahjong-jianhui
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: liuhe-mahjong-users
          property: connectionString

databases:
  - name: liuhe-mahjong-users
    region: singapore
    plan: free
    databaseName: liuhe_mahjong
    user: liuhe_mahjong
